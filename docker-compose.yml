services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://nadaraya:password@db:5432/content_machine
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=nadaraya
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=content_machine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nadaraya -d content_machine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
